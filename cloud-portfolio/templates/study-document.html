<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ filename }} | Study
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f6f7f9;

            color: #1f2937;
        }


        /* Navigation */

        nav {
            position: sticky;

            top: 0;

            z-index: 100;

            height: 68px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 48px;

            background: rgba(
                255,
                255,
                255,
                0.94
            );

            backdrop-filter: blur(10px);

            border-bottom:
                1px solid #e5e7eb;
        }


        .logo {
            color: #111827;

            text-decoration: none;

            font-size: 19px;

            font-weight: 750;
        }


        .nav-links {
            display: flex;

            gap: 26px;
        }


        .nav-links a {
            color: #6b7280;

            text-decoration: none;

            font-size: 14px;
        }


        .nav-links a:hover {
            color: #111827;
        }


        /* Page */

        .page {
            max-width: 900px;

            margin: 0 auto;

            padding:
                70px 32px 90px;
        }


        .breadcrumb {
            margin-bottom: 22px;

            color: #9ca3af;

            font-size: 13px;
        }


        .breadcrumb a {
            color: #6b7280;

            text-decoration: none;
        }


        .document-header {
            margin-bottom: 40px;
        }


        .document-header h1 {
            margin: 0;

            color: #111827;

            font-size: 38px;

            line-height: 1.25;

            letter-spacing: -1.4px;
        }


        .document-path {
            margin-top: 12px;

            color: #9ca3af;

            font-size: 13px;
        }


        /* Markdown */

        .markdown-body {
            padding: 40px;

            background: white;

            border:
                1px solid #e5e7eb;

            border-radius: 14px;

            line-height: 1.8;

            font-size: 15px;

            color: #374151;
        }


        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            color: #111827;

            line-height: 1.35;

            margin-top: 1.8em;

            margin-bottom: 0.7em;
        }


        .markdown-body h1 {
            font-size: 30px;

            border-bottom:
                1px solid #e5e7eb;

            padding-bottom: 12px;
        }


        .markdown-body h2 {
            font-size: 24px;
        }


        .markdown-body h3 {
            font-size: 20px;
        }


        .markdown-body p {
            margin:
                0 0 1em;
        }


        .markdown-body ul,
        .markdown-body ol {
            padding-left: 25px;
        }


        .markdown-body li {
            margin-bottom: 6px;
        }


        .markdown-body a {
            color: #2563eb;

            text-decoration: none;
        }


        .markdown-body a:hover {
            text-decoration: underline;
        }


        .markdown-body blockquote {
            margin:
                20px 0;

            padding:
                12px 18px;

            border-left:
                4px solid #d1d5db;

            background: #f9fafb;

            color: #6b7280;
        }


        .markdown-body code {
            padding:
                2px 5px;

            background: #f3f4f6;

            border-radius: 4px;

            font-family:
                SFMono-Regular,
                Consolas,
                monospace;

            font-size: 0.9em;
        }


        .markdown-body pre {
            margin:
                20px 0;

            padding: 18px;

            overflow-x: auto;

            background: #111827;

            border-radius: 9px;

            color: #e5e7eb;
        }


        .markdown-body pre code {
            padding: 0;

            background: transparent;

            color: inherit;
        }


        .markdown-body table {
            width: 100%;

            border-collapse: collapse;

            margin:
                20px 0;
        }


        .markdown-body th,
        .markdown-body td {
            padding:
                10px 12px;

            border:
                1px solid #e5e7eb;

            text-align: left;
        }


        .markdown-body th {
            background: #f9fafb;

            color: #111827;
        }


        .markdown-body img {
            max-width: 100%;

            height: auto;
        }


        /* Footer */

        footer {
            padding:
                30px 20px 45px;

            color: #9ca3af;

            font-size: 13px;

            text-align: center;
        }


        @media (max-width: 768px) {

            nav {
                padding: 0 20px;
            }


            .nav-links {
                display: none;
            }


            .page {
                padding:
                    50px 20px 70px;
            }


            .document-header h1 {
                font-size: 30px;
            }


            .markdown-body {
                padding: 25px;

                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <nav>

        <a
            href="/"
            class="logo"
        >
            HEEWOON CLOUD LAB
        </a>


        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/resume">
                Resume
            </a>

            <a href="/study">
                Study
            </a>

            <a href="/architecture">
                Architecture
            </a>

            <a href="/logs">
                Logs
            </a>

            <a href="/grafana">
                Grafana
            </a>

        </div>

    </nav>


    <main class="page">


        <div class="breadcrumb">

            <a href="/study">
                Study
            </a>

            /

            <a href="/study/{{ category }}">
                {{ category }}
            </a>

            /

            {{ filename }}

        </div>


        <header class="document-header">

            <h1>
                {{ filename }}
            </h1>

            <div class="document-path">

                infra_study /
                {{ category }} /
                {{ filename }}

            </div>

        </header>


        <article class="markdown-body">

            {{ markdown_html | safe }}

        </article>


    </main>


    <footer>

        Heewoon Cloud Lab
        · AWS · Kubernetes · Observability

    </footer>


</body>

</html>
