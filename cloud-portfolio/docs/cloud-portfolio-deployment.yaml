apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-portfolio
  namespace: application

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-portfolio

  template:
    metadata:
      labels:
        app: cloud-portfolio

    spec:
      containers:
        - name: cloud-portfolio

          image: 245067526307.dkr.ecr.ap-northeast-2.amazonaws.com/cloud-portfolio:1.1

          ports:
            - containerPort: 5001

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi